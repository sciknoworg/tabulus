services:
  mineru_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineru_test
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBIAN_FRONTEND=noninteractive
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped